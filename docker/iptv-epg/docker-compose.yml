services:
  iptv-epg:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/iptv-epg:1.1
    container_name: iptv-epg
    init: true
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      EPG_BIND: "0.0.0.0"
      EPG_PORT: "8091"
      EPG_SOURCE_URL: "https://epg.pw/xmltv/epg_CN.xml.gz"
      EPG_REFRESH_SECONDS: "21600"
      EPG_REQUEST_TIMEOUT: "90"
      IPTV_HLS_BASE_URL: "http://192.168.31.200:8090"
      CHANNELS_PATH: "/app/config/channels.json"
      DATA_DIR: "/app/data"
      TZ: "Asia/Shanghai"
    volumes:
      - ../iptv-hls/config/channels.json:/app/config/channels.json:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    stop_grace_period: 10s
