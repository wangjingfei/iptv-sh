services:
  iptv-hls:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/iptv-hls:1.1
    container_name: iptv-hls
    init: true
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      IPTV_BIND: "0.0.0.0"
      IPTV_PORT: "8090"
      IPTV_IDLE_TIMEOUT: "60"
      IPTV_START_TIMEOUT: "20"
      IPTV_HLS_TIME: "4"
      IPTV_HLS_LIST_SIZE: "6"
      IPTV_FFMPEG_LOGLEVEL: "warning"
    volumes:
      - ./config:/app/config:ro
    tmpfs:
      - /run/iptv-hls:size=512m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
