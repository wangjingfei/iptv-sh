name: Android TV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Run repository checks
        run: |
          python3 scripts/validate.py
          sh -n router/apply-iptv.sh router/rollback.sh router/verify.sh scripts/check-secrets.sh scripts/verify-android-signing.sh
          ./scripts/check-secrets.sh

      - name: Test and build Android TV
        working-directory: android-tv
        run: |
          ./gradlew --no-parallel testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug assembleRelease
          ./gradlew --no-parallel lintDebug

      - name: Verify release signing path
        run: ./scripts/verify-android-signing.sh

      - name: Upload Android packages
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-${{ github.sha }}
          path: |
            android-tv/app/build/outputs/apk/debug/app-debug.apk
            android-tv/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: cd android-tv && ./gradlew connectedDebugAndroidTest

      - name: Upload Android device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-tests-${{ github.sha }}
          path: |
            android-tv/app/build/reports/androidTests/connected/
            android-tv/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
